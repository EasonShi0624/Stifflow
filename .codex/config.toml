# .codex/config.toml

model = "gpt-5.4"
model_reasoning_effort = "xhigh"
personality = "pragmatic"

sandbox_mode = "workspace-write"

approval_policy = "untrusted"

web_search = "live"

[sandbox_workspace_write]
network_access = true

[features]
shell_snapshot = true
multi_agent = true

[shell_environment_policy]
inherit = "core"
include_only = ["PATH", "HOME", "CONDA_PREFIX", "CONDA_DEFAULT_ENV"]
