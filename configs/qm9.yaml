seed: 42
batch_size: 8
source:
  sigma0: 1.0
  rho: 1.0
model_args:
  network_type: TorchMDDynamics
  hidden_channels: 160
  num_layers: 20
  num_rbf: 64
  rbf_type: expnorm
  trainable_rbf: true
  activation: silu
  neighbor_embedding: true
  cutoff_lower: 0.0
  cutoff_upper: 10.0
  max_z: 100
  node_attr_dim: 10
  edge_attr_dim: 3
  attn_activation: silu
  num_heads: 8
  distance_influence: both
  reduce_op: sum
  qk_norm: true
  clip_during_norm: true
  so3_equivariant: true
  output_layer_norm: true
  sigma: 0.0
  prior_type: gaussian
  optimizer_type: AdamW
  lr: 0.0007
  weight_decay: 1.0e-08
  lr_scheduler_type: CosineAnnealingWarmupRestarts
  first_cycle_steps: 250000
  cycle_mult: 1.0
  max_lr: 0.0007
  min_lr: 1.0e-08
  warmup_steps: 0
  gamma: 0.05
  last_epoch: -1
  lr_scheduler_monitor: val/loss
  lr_scheduler_interval: step
  lr_scheduler_frequency: 1
  parity_switch: null
  sample_time_dist: uniform
profiles:
  smoke:
    train_molecules: 32
    val_molecules: 8
    steps: 50
  pilot:
    train_molecules: 128
    val_molecules: 32
    steps: 1000
