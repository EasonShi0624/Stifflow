# First formal bounded 10000-molecule training configuration.
# Same frozen artifact, split, model, optimizer, checkpoint/reload pattern,
# training horizon, and one-step sampling settings as isotropic; only source
# corruption changes.

experiment:
  name: geom_formal_10000_train_stiffness_mols10000_steps2000_seed0
  seed: 0
  output_root: experiments

data:
  dataset_name: geom_drugs
  dataset_kind: geom_drugs_tiny_processed_dry_run
  raw_root: data/raw/geom_drugs
  processed_root: data/processed/geom_drugs_subset/data_scale_check_10000
  split_root: data/splits/geom_drugs_data_scale_check_10000/random_seed0
  processed_artifact_path: data/processed/geom_drugs_subset/data_scale_check_10000/molecules.json
  split_path: data/splits/geom_drugs_data_scale_check_10000/random_seed0/split.json
  split_type: random
  subset:
    max_molecules: 10000
    max_conformers_per_mol: 1
    tag: data_scale_check_10000_processed_dry_run

model:
  backbone: minimal_linear_velocity_pilot
  pilot_model: single_linear_velocity_pilot
  hidden_dim: 0
  num_layers: 1
  time_embedding_dim: 1

flow_matching:
  objective: cartesian_linear
  interpolation: linear

corruption:
  mode: stiffness_structured
  stiffness_table: heuristic_v1
  protect_rings: true
  protect_amides: true
  isotropic_sigma: 0.25
  bond_sigma: 0.02
  angle_sigma: 0.08
  torsion_sigma: 0.30

train:
  enabled: true
  formal_training: true
  pilot_only: false
  batch_scope: data_scale_check_train_split
  max_steps: 2000
  hard_max_steps: 2000
  optimizer: SGD
  learning_rate: 1.0e-2
  num_workers: 0
  checkpointing_enabled: true
  checkpoint_scope: reusable_formal_10000_validation_selected_checkpoint
  early_stop:
    enabled: true
    monitor: validation_loss_after_step
    patience: 200
    min_delta: 1.0e-6

sample:
  enabled: true
  pilot_only: false
  sample_step_count: 1
  sample_step_size: 0.1
  sample_scope: all_10000_data_scale_check_molecules

eval:
  enabled: true
  eval_subset_size: 10000
  compute_train_val_test_losses: true
  compute_cov_mat: false
  compute_validity: false
  compute_energy_checks: false

logging:
  save_manifest: true
  save_results_json: true
  save_log: true
