# Tiny stiffness-structured smoke configuration.
# Same smoke fixture, backbone fields, and Cartesian objective as tiny_smoke.yaml;
# only the source corruption mode differs.

experiment:
  name: smoke_random_stiffness_seed0
  seed: 0
  output_root: experiments

data:
  dataset_name: synthetic_smoke
  raw_root: data/raw/geom_drugs
  processed_root: data/processed/smoke_fixture
  split_root: data/splits
  split_type: random
  subset:
    max_molecules: 6
    max_conformers_per_mol: 2
    tag: synthetic_smoke

model:
  backbone: egnn_fallback
  hidden_dim: 128
  num_layers: 4
  time_embedding_dim: 64

flow_matching:
  objective: cartesian_linear
  interpolation: linear

corruption:
  mode: stiffness_structured
  stiffness_table: heuristic_v1
  protect_rings: true
  protect_amides: true
  isotropic_sigma: 0.25
  bond_sigma: 0.02
  angle_sigma: 0.08
  torsion_sigma: 0.30

train:
  enabled: true
  batch_size: 8
  max_steps: 100
  learning_rate: 1.0e-4
  num_workers: 0

sample:
  enabled: true
  num_samples_per_mol: 2
  num_steps: 20

eval:
  enabled: true
  compute_cov_mat: true
  compute_validity: true
  compute_energy_checks: false
  eval_subset_size: 64

logging:
  save_manifest: true
  save_results_json: true
  save_log: true
