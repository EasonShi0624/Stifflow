# Bounded 500-molecule data-scale-check configuration.
# Same artifact and checkpoint/sampling settings as isotropic; only source corruption changes.

experiment:
  name: geom_data_scale_check_ckpt_sample_stiffness_mols500_steps5_seed0
  seed: 0
  output_root: experiments

data:
  dataset_name: geom_drugs
  dataset_kind: geom_drugs_tiny_processed_dry_run
  raw_root: data/raw/geom_drugs
  processed_root: data/processed/geom_drugs_subset/data_scale_check_500
  split_root: data/splits/geom_drugs_data_scale_check_500/random_seed0
  processed_artifact_path: data/processed/geom_drugs_subset/data_scale_check_500/molecules.json
  split_path: data/splits/geom_drugs_data_scale_check_500/random_seed0/split.json
  split_type: random
  subset:
    max_molecules: 500
    max_conformers_per_mol: 1
    tag: data_scale_check_500_processed_dry_run

model:
  backbone: minimal_linear_velocity_pilot
  pilot_model: single_linear_velocity_pilot
  hidden_dim: 0
  num_layers: 1
  time_embedding_dim: 1

flow_matching:
  objective: cartesian_linear
  interpolation: linear

corruption:
  mode: stiffness_structured
  stiffness_table: heuristic_v1
  protect_rings: true
  protect_amides: true
  isotropic_sigma: 0.25
  bond_sigma: 0.02
  angle_sigma: 0.08
  torsion_sigma: 0.30

train:
  enabled: true
  pilot_only: true
  batch_scope: data_scale_check_train_split
  max_steps: 5
  hard_max_steps: 5
  learning_rate: 1.0e-2
  num_workers: 0
  checkpointing_enabled: false

sample:
  enabled: false
  num_samples_per_mol: 0
  num_steps: 0

eval:
  enabled: true
  eval_subset_size: 500
  compute_train_val_test_losses: true
  compute_cov_mat: false
  compute_validity: false
  compute_energy_checks: false

logging:
  save_manifest: true
  save_results_json: true
  save_log: true
